<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /* Box-Level Element */
            background-color: lightgray;
            height: 300px;
            width: 300px;

        /*  BORDA DA CAIXA
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray; */

            /* Simplificando */
            border: 10px solid darkslategray;

        /*  ESPAÇO DENTRO DA CAIXA: ACOLCHOAMENTO
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px; */

            /* Simplificando */
            padding: 10px; /* Se forem iguais: valor único */

        /*  padding: 10px 20px; 
        =>      eixo x: right e left = 20px
                eixo y: top e bottom = 10px
        */

        /*  margin: auto; => Centraliza a caixa horizontalmente 
            ESPAÇO FORA DA CAIXA: MARGEM
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
        */
            /* Simplificando */
        /*  margin: 20px 20px 40px 20px; */
            margin: 20px auto 40px auto;
        /* Substituindo os valores de right e left por [auto] você tem
        a caixa centralizado horizintalmente na tela */

        /*  LINHA FORA DA CAIXA DENTRO DA MARGEM
            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
        */

            /* Simplificando */
            outline: 5px dashed salmon;
        }

        a { /* Inline-Level Element */
            border: 10px solid red;
            padding: 10px;
        }
        a:hover {
            border-color: green;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
